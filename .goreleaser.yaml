version: 2

project_name: telegram-archive-mcp
release:
  github:
    owner: GeiserX
    name: telegram-archive-mcp
  draft: false
  prerelease: auto # tag "v0.3.0-rc1" becomes pre-release

builds:
  - id: bin
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/geiserx/telegram-archive-mcp/version.Version={{ .Version }}
      - -X github.com/geiserx/telegram-archive-mcp/version.Commit={{ .ShortCommit }}
      - -X github.com/geiserx/telegram-archive-mcp/version.Date={{ .Date }}

# Signs the darwin binaries with a Developer ID certificate and notarizes them
# with Apple, from Linux, before they are archived. Skipped when the secrets
# are absent (pull requests, snapshots); release.yml fails a tag build that
# lacks any of them, so a release is never shipped unsigned by accident.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [bin]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: dist
    ids: [bin]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

# Each image copies in the linux binary built above (ids: [bin]); the
# Dockerfile does not compile anything.
dockers:
  # ------------- amd64 -------------
  - image_templates:
      - "drumsergio/telegram-archive-mcp:{{ .Tag }}-amd64"
      - "drumsergio/telegram-archive-mcp:latest-amd64"
    dockerfile: Dockerfile
    ids:    [bin]
    goos:   linux
    goarch: amd64
    use:    buildx
    build_flag_templates:
      - "--platform=linux/amd64"
  # ------------- arm64 -------------
  - image_templates:
      - "drumsergio/telegram-archive-mcp:{{ .Tag }}-arm64"
      - "drumsergio/telegram-archive-mcp:latest-arm64"
    dockerfile: Dockerfile
    ids:    [bin]
    goos:   linux
    goarch: arm64
    use:    buildx
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  # stitch the per-arch images into a combined tag = multi-arch
  - name_template: 'drumsergio/telegram-archive-mcp:{{ .Tag }}'
    image_templates:
      - 'drumsergio/telegram-archive-mcp:{{ .Tag }}-amd64'
      - 'drumsergio/telegram-archive-mcp:{{ .Tag }}-arm64'
  - name_template: 'drumsergio/telegram-archive-mcp:latest'
    image_templates:
      - 'drumsergio/telegram-archive-mcp:latest-amd64'
      - 'drumsergio/telegram-archive-mcp:latest-arm64'

snapshot:
  version_template: "snapshot-{{ .ShortCommit }}"

changelog:
  groups:
    - title: "Features"
      regexp: '^feat'
    - title: "Fixes"
      regexp: '^fix'
