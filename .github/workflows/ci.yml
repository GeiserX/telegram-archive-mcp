name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -v -race -coverprofile=coverage.out ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm installer tests
        run: node --test
      - name: Wait-for-npm script
        run: .github/scripts/wait-for-npm_test.sh
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned rather than @latest: a new govulncheck release should arrive as a
      # reviewed change, like every other tool here.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build-arm64:
    # Named build-arm64 because the main ruleset requires a check of that name;
    # this job covers what the old arm64-only build did and more.
    # Runs the release's own goreleaser config without publishing: all six
    # binaries and both Docker images (the arm64 one under QEMU). A broken
    # .goreleaser.yaml or Dockerfile used to surface only after a tag was cut;
    # that is how a golang bump once cost duplicacy-cli-cron a burned version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
      - name: Both images start, run as non-root and answer on stdio
        run: |
          for arch in amd64 arm64; do
            image="drumsergio/telegram-archive-mcp:latest-$arch"
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "65532:65532"
            docker run --rm --platform "linux/$arch" "$image" --version
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              | docker run -i --rm --platform "linux/$arch" "$image" | grep -q '"protocolVersion":"2025-11-25"'
          done
