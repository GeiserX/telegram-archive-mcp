name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    # Runs before anything publishes: the tag, package.json and server.json must
    # name the same version, or postinstall.js and the MCP registry would point
    # at a release that does not match.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          # server.json carries the version twice: its own, and packages[0].version,
          # the npm version the MCP registry installs.
          for field in "package.json:.version" "server.json:.version" "server.json:.packages[0].version"; do
            f="${field%%:*}"
            got=$(node -p "require('./$f')${field#*:}")
            if [ "$got" != "$v" ]; then
              echo "::error file=$f::${field#*:} is $got, the tag says $v"
              exit 1
            fi
          done
          # The OCI package is tagged with the version too; the registry would
          # otherwise point at a different image than the one this tag builds.
          oci=$(node -p "require('./server.json').packages.find(p => p.registryType === 'oci').identifier")
          if [ "${oci##*:}" != "v$v" ]; then
            echo "::error file=server.json::OCI identifier is $oci, the tag says v$v"
            exit 1
          fi

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    # contents: write publishes the GitHub release. id-token and attestations
    # write let the job sign build provenance for the archives (see the
    # attestation step after GoReleaser). Docker Hub and Apple use their own secrets.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog is built from the commits since the previous tag; a
          # shallow clone has none of them and left the v0.3.1 notes empty.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # .goreleaser.yaml skips signing when the secrets are absent, which is
      # right for snapshots and wrong for a release: stop here instead.
      - name: Require the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=0
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact, like ci.yml's build-arm64 job, so what CI checked is what ships.
          version: v2.19.0
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # Signed build provenance for every archive in checksums.txt, stored by
      # GitHub and checkable with: gh attestation verify <archive> --repo <owner/repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+; Node 24 ships both, so no ad-hoc npm install.
          node-version: '24'
          # A stale runner cache could hold an early 24.x with npm below 11.5.1.
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # postinstall.js verifies the binary against this copy, which npm's
      # provenance then covers. A release asset swapped after publishing no
      # longer matches.
      - name: Bundle the release checksums into the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          v="${GITHUB_REF_NAME#v}"
          for os_arch in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            grep -Eq "^[0-9a-f]{64}  telegram-archive-mcp_${v}_${os_arch}\.tar\.gz$" checksums.txt
          done
          for os_arch in windows_amd64 windows_arm64; do
            grep -Eq "^[0-9a-f]{64}  telegram-archive-mcp_${v}_${os_arch}\.zip$" checksums.txt
          done
          npm pack --dry-run 2>&1 | grep -q 'checksums.txt'
      - run: npm publish --loglevel verbose

  mcp-registry:
    needs: npm-publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
