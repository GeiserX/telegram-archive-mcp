version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # No major-version ignore here: it hid every mcp-go v1.x release, and v1.0.0
    # is where the 2026-07-28 protocol landed. A major bump arrives as its own PR.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # The docs site's one pin (zensical). Monthly: the strict build and
  # site-check in the Docs workflow prove each bump, a major one included.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: build(docs)
